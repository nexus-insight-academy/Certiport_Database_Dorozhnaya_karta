<script>
const b=document.body,r=document.getElementById('bru'),o=document.getElementById('bro');
let set=function(l){b.dataset.lang=l;r.classList.toggle('on',l==='ru');o.classList.toggle('on',l==='ro');
 document.documentElement.lang=l;try{localStorage.setItem('rm_lang',l)}catch(e){}};
r.onclick=()=>set('ru');o.onclick=()=>set('ro');
const DET = {"Database": {"ru": "Представьте школьный журнал, только электронный и очень большой. Данные в нём лежат не сплошным текстом, а разложены по таблицам: отдельно ученики, отдельно предметы, отдельно оценки. Именно поэтому в них можно искать, их можно менять и из них можно собрать любой отчёт за секунду.", "ro": "Imaginați-vă un catalog școlar, doar că electronic și foarte mare. Datele nu stau în el ca un text continuu, ci sunt așezate pe tabele: separat elevii, separat materiile, separat notele. Tocmai de aceea în ele se poate căuta, se pot modifica și din ele se poate face orice raport într-o secundă.", "sql": "CREATE DATABASE nexus_academy;\nUSE nexus_academy;", "res_ru": "Создана база и выбрана как текущая.", "res_ro": "Baza este creată și aleasă ca cea curentă."}, "DBMS": {"ru": "База — это сами данные. СУБД — программа, которая их хранит и отвечает на ваши запросы. Сравните: тетрадь и человек, который в ней ищет. SQL Server, PostgreSQL, MySQL, Oracle — это разные такие программы. Данные у всех одни и те же, а команды кое-где пишутся по-разному — именно поэтому курс всё время показывает две формы.", "ro": "Baza înseamnă datele în sine. SGBD este programul care le păstrează și răspunde la întrebările voastre. Comparați: caietul și omul care caută în el. SQL Server, PostgreSQL, MySQL, Oracle sunt astfel de programe diferite. Datele sunt aceleași la toate, dar comenzile se scriu pe alocuri diferit — tocmai de aceea cursul arată mereu două forme.", "sql": "SELECT DB_NAME();          -- SQL Server\n-- SELECT current_database();  -- PostgreSQL", "res_ru": "Имя базы, к которой вы сейчас подключены.", "res_ro": "Numele bazei la care sunteți conectați acum."}, "SQL": {"ru": "Язык, на котором вы разговариваете с базой. Он похож на английские фразы, и слов в нём немного. Четыре главных: SELECT — покажи, INSERT — добавь, UPDATE — измени, DELETE — удали. Всё остальное — уточнения к этим четырём.", "ro": "Limbajul în care vorbiți cu baza. Seamănă cu niște fraze în engleză și nu are multe cuvinte. Patru sunt principale: SELECT — arată, INSERT — adaugă, UPDATE — schimbă, DELETE — șterge. Tot restul sunt precizări la aceste patru.", "sql": "SELECT first_name, last_name FROM students;", "res_ru": "20 строк: имя и фамилия каждого ученика.", "res_ro": "20 de rânduri: prenumele și numele fiecărui elev."}, "ANSI SQL": {"ru": "Это общий «литературный» SQL, одинаковый для всех серверов. Вопросы экзамена написаны именно в нём. А курс, видео и ваш рабочий сервер показывают форму SQL Server — она короче и привычнее. Поэтому одно и то же действие вы увидите записанным двумя способами. Не пугайтесь: выбирайте тот, о котором спрашивают.", "ro": "Acesta este SQL-ul „literar” comun, la fel pentru toate serverele. Întrebările examenului sunt scrise exact în el. Iar cursul, videoclipurile și serverul vostru de lucru arată forma SQL Server — este mai scurtă și mai obișnuită. De aceea aceeași acțiune o veți vedea scrisă în două feluri. Nu vă speriați: alegeți forma despre care se întreabă.", "sql": "SELECT last_name FROM students ORDER BY tuition DESC\nOFFSET 0 ROWS FETCH NEXT 3 ROWS ONLY;  -- ANSI\nSELECT TOP 3 last_name FROM students ORDER BY tuition DESC;  -- SQL Server", "res_ru": "Обе команды дают одни и те же 3 строки.", "res_ro": "Ambele comenzi dau aceleași 3 rânduri."}, "Entity · Record · Field": {"ru": "Одно и то же называют двумя словами, и экзамен использует оба вперемешку. Таблица — она же сущность (entity). Строка — она же запись (record). Столбец — он же поле (field). Запомните парами, иначе знакомый вопрос покажется незнакомым только из-за слова.", "ro": "Același lucru se numește cu două cuvinte, iar examenul le folosește pe amândouă amestecat. Tabelul — adică entitatea (entity). Rândul — adică înregistrarea (record). Coloana — adică câmpul (field). Țineți-le minte în perechi, altfel o întrebare cunoscută vi se va părea necunoscută doar din cauza cuvântului.", "sql": "SELECT student_id, first_name FROM students;\n-- students — сущность, каждая строка — запись,\n-- student_id и first_name — поля", "res_ru": null, "res_ro": null}, "CREATE TABLE": {"ru": "Создать таблицу — значит ответить на три вопроса: как она называется, какие в ней столбцы и что в каждом столбце лежит. Эти три вещи нужны всегда, без них команда не работает. Ключи, ограничения и значения по умолчанию добавляют сверху, по желанию.", "ro": "A crea un tabel înseamnă a răspunde la trei întrebări: cum se numește, ce coloane are și ce stă în fiecare coloană. Aceste trei lucruri sunt mereu necesare, fără ele comanda nu merge. Cheile, restricțiile și valorile implicite se adaugă deasupra, opțional.", "sql": "CREATE TABLE clubs (\n    club_id    int IDENTITY(1,1) PRIMARY KEY,\n    title      varchar(60) NOT NULL,\n    max_places smallint    NOT NULL);", "res_ru": null, "res_ro": null}, "ALTER TABLE": {"ru": "Команда для изменения уже готовой таблицы. Главное правило: одно изменение — одна команда. Нужно добавить два столбца, пишите две команды подряд, в одну их не склеить. И ещё: в SQL Server слово COLUMN после ADD не пишут, хотя в других серверах оно есть.", "ro": "Comanda pentru modificarea unui tabel deja făcut. Regula principală: o modificare — o comandă. Vă trebuie două coloane, scrieți două comenzi una după alta, nu le puteți lipi într-una. Și încă ceva: în SQL Server cuvântul COLUMN după ADD nu se scrie, deși la alte servere există.", "sql": "ALTER TABLE students ADD birth_date date;\nALTER TABLE students ADD is_active bit NOT NULL DEFAULT 1;", "res_ru": "Два столбца добавлены двумя отдельными командами.", "res_ro": "Două coloane adăugate prin două comenzi separate."}, "DROP · TRUNCATE": {"ru": "Две команды, которые легко перепутать, а разница огромная. TRUNCATE убирает строки, но таблица остаётся — как стереть записи из тетради, оставив разлиновку. DROP убирает таблицу целиком, вместе с разлиновкой. После TRUNCATE запрос SELECT ещё работает и показывает ноль строк. После DROP он уже выдаёт ошибку: такой таблицы нет.", "ro": "Două comenzi ușor de confundat, iar diferența este uriașă. TRUNCATE scoate rândurile, dar tabelul rămâne — ca și cum ați șterge însemnările din caiet, lăsând liniatura. DROP scoate tabelul complet, împreună cu liniatura. După TRUNCATE interogarea SELECT încă merge și arată zero rânduri. După DROP ea dă deja eroare: un astfel de tabel nu există.", "sql": "TRUNCATE TABLE clubs;   -- строк 0, таблица есть\nDROP TABLE clubs;       -- таблицы больше нет", "res_ru": null, "res_ro": null}, "PRIMARY KEY": {"ru": "Это столбец, по которому строку можно найти и ни с какой другой не перепутать. Как номер в классном журнале: двух одинаковых нет, и пустым он не бывает никогда. Поэтому фамилия ключом не годится — Руссу в школе может быть двое. А вот числом ключ быть не обязан: подойдёт и текстовый код вроде MD.", "ro": "Este coloana după care rândul poate fi găsit și nu poate fi confundat cu niciun altul. Ca numărul din catalog: două la fel nu există, iar gol nu este niciodată. De aceea numele de familie nu merge ca cheie — Rusu în școală pot fi doi. Dar cheia nu trebuie neapărat să fie un număr: merge și un cod text, de exemplu MD.", "sql": "CREATE TABLE subjects (\n    subject_id int IDENTITY(1,1) PRIMARY KEY,\n    title      varchar(60) NOT NULL);\n\nINSERT INTO subjects (title) VALUES ('Mathematics');\n-- повтор ключа: Msg 2627, violation of PRIMARY KEY constraint", "res_ru": null, "res_ro": null}, "Composite key": {"ru": "Иногда ни один столбец сам по себе не уникален, а вместе они — да. Ученик записан на много предметов, на предмет ходит много учеников, но пара «этот ученик + этот предмет» встречается ровно один раз. Вот эта пара и становится ключом. У него два имени, composite и compound, и экзамен пользуется обоими.", "ro": "Uneori nicio coloană singură nu este unică, dar împreună sunt. Elevul este înscris la multe materii, la materie merg mulți elevi, dar perechea „acest elev + această materie” apare exact o singură dată. Tocmai această pereche devine cheie. Ea are două nume, composite și compound, iar examenul le folosește pe ambele.", "sql": "CREATE TABLE enrollments (\n    student_id int NOT NULL,\n    subject_id int NOT NULL,\n    PRIMARY KEY (student_id, subject_id));", "res_ru": "Один ученик может быть на многих предметах, пара «ученик + предмет» — только одна.", "res_ro": "Un elev poate fi la multe materii, perechea „elev + materie” — doar una."}, "FOREIGN KEY": {"ru": "Это столбец, который хранит не сами данные, а ссылку на строку другой таблицы. В платеже не пишут имя ученика целиком — пишут его номер, а имя лежит в таблице учеников. Внешний ключ и показывает, кто здесь главный: таблица, на которую ссылаются, — родитель, та, что ссылается, — ребёнок.", "ro": "Este coloana care păstrează nu datele în sine, ci o trimitere spre un rând din alt tabel. În plată nu se scrie numele elevului întreg — se scrie numărul lui, iar numele stă în tabelul elevilor. Cheia externă arată și cine este principalul aici: tabelul spre care se face trimiterea este părintele, cel care face trimiterea — copilul.", "sql": "ALTER TABLE payments\nADD CONSTRAINT fk_pay_student\n    FOREIGN KEY (student_id) REFERENCES students(student_id);", "res_ru": "Теперь платёж нельзя записать на несуществующего ученика.", "res_ro": "Acum o plată nu poate fi scrisă pe un elev inexistent."}, "Surrogate · Natural": {"ru": "Два способа выбрать ключ. Natural — взять что-то уже существующее: код страны, номер паспорта. Surrogate — завести отдельный номер, который ничего не значит и нужен только для различения. Surrogate надёжнее: паспорт можно поменять, страну переименовать, а выдуманный номер не изменится никогда.", "ro": "Două moduri de a alege cheia. Natural — a lua ceva care există deja: codul țării, numărul pașaportului. Surrogate — a face un număr separat, care nu înseamnă nimic și e necesar doar pentru a deosebi. Surrogate este mai sigură: pașaportul poate fi schimbat, țara redenumită, iar numărul inventat nu se schimbă niciodată.", "sql": "student_id int IDENTITY(1,1) PRIMARY KEY   -- surrogate\ncountry_code char(2) PRIMARY KEY           -- natural: 'MD', 'RO'", "res_ru": null, "res_ro": null}, "Alternate key": {"ru": "Бывает, что на роль ключа подходят сразу несколько столбцов. Один выбрали первичным, остальные остались кандидатами — их и называют alternate key. Уникальность у них всё равно должна соблюдаться, поэтому на такой столбец вешают UNIQUE.", "ro": "Se întâmplă ca pentru rolul de cheie să fie potrivite mai multe coloane deodată. Una a fost aleasă primară, celelalte au rămas candidate — ele se numesc alternate key. Unicitatea trebuie totuși respectată, de aceea pe o astfel de coloană se pune UNIQUE.", "sql": "ALTER TABLE students ADD CONSTRAINT uq_email UNIQUE (email);", "res_ru": "email не ключ, но двух одинаковых адресов не будет.", "res_ro": "email nu este cheie, dar două adrese identice nu vor exista."}, "int · smallint · tinyint": {"ru": "Все четыре типа хранят целые числа, разница только в том, сколько места занимают и какое самое большое число помещается. Правило простое: берите самый маленький, в который значение заведомо влезет. Класс никогда не будет больше 12, значит tinyint. Номер ученика может дорасти до тысяч — значит int.", "ro": "Toate cele patru tipuri păstrează numere întregi, diferența este doar cât loc ocupă și care este cel mai mare număr care încape. Regula e simplă: luați-l pe cel mai mic în care valoarea încape sigur. Clasa nu va fi niciodată mai mare de 12, deci tinyint. Numărul elevului poate ajunge la mii — deci int.", "sql": "grade      tinyint   -- класс: от 1 до 12\nhours_total smallint  -- часов за год\nstudent_id int       -- номер ученика", "res_ru": null, "res_ro": null}, "decimal": {"ru": "Для денег годится только decimal. float хранит число приблизительно: разница в тысячную долю копейки незаметна на одном платеже, но после сложения тысячи платежей итог не сойдётся с кассой. decimal считает точно, копейка в копейку — поэтому для сумм берут только его.", "ro": "Pentru bani merge doar decimal. float păstrează numărul aproximativ: diferența de o miime de ban nu se vede la o singură plată, dar după adunarea a mii de plăți totalul nu se potrivește cu casa. decimal socotește exact, ban cu ban — de aceea pentru sume se ia doar el.", "sql": "amount decimal(7,2)   -- верно: до 99999.99 копейка в копейку\namount float          -- неверно: ошибка накапливается", "res_ru": null, "res_ro": null}, "varchar · nvarchar": {"ru": "varchar хранит ровно столько символов, сколько вы положили, и годится для имён, адресов, описаний. Буква n впереди означает Unicode — поддержку любых алфавитов. Без неё сервер хранит только свой набор символов, и кириллица или румынские буквы с диакритикой превращаются в вопросительные знаки. Исправить это задним числом уже нельзя: буквы потеряны.", "ro": "varchar păstrează exact atâtea caractere câte ați pus și este bun pentru nume, adrese, descrieri. Litera n din față înseamnă Unicode — suportul oricărui alfabet. Fără ea serverul păstrează doar setul lui de caractere, iar chirilica sau literele românești cu diacritice devin semne de întrebare. Asta nu mai poate fi reparat ulterior: literele sunt pierdute.", "sql": "SELECT CAST(N'Chișinău' AS nvarchar(20));  -- Chișinău\nSELECT CAST('Chișinău'  AS varchar(20));   -- Chi?in?u", "res_ru": "Без N кириллица и румынские буквы теряются.", "res_ro": "Fără N, chirilica și literele românești se pierd."}, "char": {"ru": "char всегда занимает ровно столько символов, сколько указано, и недостающее добивает пробелами. Для имени это плохо: «Ion» займёт столько же места, сколько «Alexandrina». Зато он идеален там, где длина всегда одна и та же: код страны из двух букв, хеш пароля из 64 символов.", "ro": "char ocupă mereu exact atâtea caractere câte au fost indicate, iar ce lipsește completează cu spații. Pentru un nume este rău: „Ion” va ocupa tot atâta loc cât „Alexandrina”. În schimb este ideal acolo unde lungimea este mereu aceeași: codul țării din două litere, hash-ul parolei din 64 de caractere.", "sql": "country_code  char(2)       -- 'MD', 'RO' — всегда два символа\npassword_hash char(64)      -- sha256 в hex — всегда 64", "res_ru": null, "res_ro": null}, "date · bit": {"ru": "Дату нужно хранить типом date, а не текстом. Текст сортируется по буквам, и «10.01» окажется раньше «02.02», хотя январь позже февраля — отчёт получится неверным. bit — это да или нет, хранится как 1 или 0. Отдельного типа boolean в SQL Server нет, и об этом спрашивают.", "ro": "Data trebuie păstrată cu tipul date, nu ca text. Textul se sortează după litere, iar „10.01” ajunge înaintea lui „02.02”, deși ianuarie este mai târziu decât februarie — raportul va ieși greșit. bit înseamnă da sau nu, se păstrează ca 1 sau 0. Tip boolean separat nu există în SQL Server, și despre asta se întreabă.", "sql": "birth_date date NOT NULL,\nis_active  bit  NOT NULL DEFAULT 1", "res_ru": null, "res_ro": null}, "One-to-many": {"ru": "Самая частая связь в любой базе. У одного ученика много платежей, но каждый платёж принадлежит ровно одному ученику. Запомните, где живёт внешний ключ: в той таблице, которой «много». В платежах есть номер ученика, а в учениках списка платежей нет — и не должно быть.", "ro": "Cea mai frecventă relație din orice bază. Un elev are multe plăți, dar fiecare plată aparține exact unui elev. Țineți minte unde stă cheia externă: în tabelul care este „multe”. În plăți există numărul elevului, iar în elevi lista plăților nu există — și nici nu trebuie.", "sql": "-- один ученик — много платежей\nCREATE TABLE payments (\n    payment_id int IDENTITY(1,1) PRIMARY KEY,\n    student_id int NOT NULL REFERENCES students(student_id),\n    amount     decimal(7,2) NOT NULL);", "res_ru": null, "res_ro": null}, "One-to-one": {"ru": "Устроена точно так же, как один ко многим, но с одним добавлением: на внешний ключ ставят UNIQUE. Именно это слово и превращает связь в «один к одному». У ученика одна фотография, и вторую сервер уже не примет. Уберите UNIQUE — и связь молча станет «один ко многим», никто вам об этом не скажет. На экзамене спрашивают ровно это.", "ro": "Este făcută exact ca unu la multe, dar cu o adăugire: pe cheia externă se pune UNIQUE. Tocmai acest cuvânt transformă relația în „unu la unu”. Elevul are o singură fotografie, iar pe a doua serverul nu o mai acceptă. Scoateți UNIQUE — și relația devine tăcut „unu la multe”, nimeni nu vă va spune. La examen exact asta se întreabă.", "sql": "CREATE TABLE student_photos (\n    photo_id   int IDENTITY(1,1) PRIMARY KEY,\n    student_id int NOT NULL UNIQUE REFERENCES students(student_id));", "res_ru": "Вторая фотография тому же ученику: Msg 2627.", "res_ro": "A doua fotografie aceluiași elev: Msg 2627."}, "Many-to-many": {"ru": "Ученик ходит на много предметов, на предмет ходит много учеников. Двумя таблицами это не записать: некуда положить внешний ключ. Поэтому всегда появляется третья, связующая таблица — в ней по строке на каждую пару. Её первичный ключ и есть эта пара. Если в вопросе звучит «многие ко многим», ответ всегда содержит третью таблицу.", "ro": "Elevul merge la multe materii, la materie merg mulți elevi. Cu două tabele asta nu se poate scrie: nu ai unde pune cheia externă. De aceea apare mereu un al treilea tabel, de legătură — în el câte un rând pentru fiecare pereche. Cheia lui primară este chiar această pereche. Dacă în întrebare sună „multe la multe”, răspunsul conține mereu un al treilea tabel.", "sql": "CREATE TABLE enrollments (\n    student_id int NOT NULL REFERENCES students(student_id),\n    subject_id int NOT NULL REFERENCES subjects(subject_id),\n    PRIMARY KEY (student_id, subject_id));", "res_ru": null, "res_ro": null}, "Referential integrity": {"ru": "Это сторож, который не даёт появиться платежу от несуществующего ученика. Такую строку называют сиротой. Сторож срабатывает в двух противоположных случаях: когда добавляют ребёнка, у которого нет родителя, и когда удаляют родителя, у которого есть дети. Обе ошибки — это не поломка, а правильная работа базы.", "ro": "Acesta este paznicul care nu lasă să apară o plată de la un elev inexistent. Un astfel de rând se numește orfan. Paznicul se declanșează în două cazuri opuse: când se adaugă un copil care nu are părinte și când se șterge un părinte care are copii. Ambele erori nu sunt o defecțiune, ci funcționarea corectă a bazei.", "sql": "INSERT INTO enrollments VALUES (999, 1);   -- Msg 547, ребёнка без родителя нельзя\nDELETE FROM students WHERE student_id = 1; -- Msg 547, у родителя есть дети", "res_ru": null, "res_ro": null}, "ERD": {"ru": "Схема «сущность-связь» — это рисунок: прямоугольники-таблицы и линии между ними. По нему удобно объяснять и проверять замысел. Но помните главное: нарисованная линия ничего не запрещает. Пока внешний ключ не объявлен командой, в базу спокойно войдёт любая сирота. Схема показывает, ключ запрещает.", "ro": "Diagrama entitate-relație este un desen: dreptunghiuri-tabele și linii între ele. Pe ea este comod să explicați și să verificați ideea. Dar țineți minte principalul: o linie desenată nu interzice nimic. Până când cheia externă nu este declarată printr-o comandă, în bază intră liniștit orice orfan. Schema arată, cheia interzice.", "sql": "-- на схеме: students 1 ──< enrollments >── 1 subjects\n-- в базе это работает только после:\nALTER TABLE enrollments ADD FOREIGN KEY (student_id)\n    REFERENCES students(student_id);", "res_ru": null, "res_ro": null}, "1NF": {"ru": "Первое правило порядка: в каждой клетке ровно одно значение. Два телефона через запятую в одном столбце — нарушение. «Ion Popescu» в столбце «имя» — тоже нарушение, это два значения. Почему это плохо: по такому столбцу нельзя отсортировать по фамилии и нельзя честно найти нужный телефон.", "ro": "Prima regulă a ordinii: în fiecare căsuță exact o valoare. Două telefoane despărțite prin virgulă într-o coloană — încălcare. „Ion Popescu” în coloana „nume” — tot încălcare, sunt două valori. De ce este rău: după o astfel de coloană nu se poate sorta după numele de familie și nu se poate găsi cinstit telefonul căutat.", "sql": "-- нарушено\nstudent_name varchar(100)   -- 'Ion Popescu'\n\n-- исправлено\nfirst_name varchar(50),\nlast_name  varchar(50)", "res_ru": null, "res_ro": null}, "2NF": {"ru": "Второе правило работает только тогда, когда ключ состоит из нескольких столбцов. Смысл такой: столбец должен зависеть от ВСЕГО ключа, а не от его половины. Ключ — пара «ученик + предмет», а число часов зависит только от предмета, ученик тут ни при чём. Значит, часы лежат не в своей таблице. Если ключ из одного столбца, нарушить второе правило невозможно.", "ro": "A doua regulă funcționează doar atunci când cheia este formată din mai multe coloane. Sensul este acesta: coloana trebuie să depindă de TOATĂ cheia, nu de jumătatea ei. Cheia este perechea „elev + materie”, iar numărul de ore depinde doar de materie, elevul nu are nicio legătură. Înseamnă că orele stau în alt tabel decât al lor. Dacă cheia e dintr-o singură coloană, a doua regulă nu poate fi încălcată.", "sql": "-- ключ (student_id, subject_id), а часов зависит только от предмета\nsubject_hours int   -- нарушение 2NF\n-- лечится переносом в subjects", "res_ru": null, "res_ro": null}, "3NF": {"ru": "Третье правило: обычный столбец не должен зависеть от другого обычного столбца. Пример, который спрашивают чаще всего: в таблице учеников лежат индекс и страна. Но страна определяется индексом, а не учеником. Значит, этой паре место в отдельной таблице, а здесь должен остаться только индекс.", "ro": "A treia regulă: o coloană obișnuită nu trebuie să depindă de altă coloană obișnuită. Exemplul care se întreabă cel mai des: în tabelul elevilor stau codul poștal și țara. Dar țara se determină din codul poștal, nu din elev. Înseamnă că acestei perechi îi este locul într-un tabel separat, iar aici trebuie să rămână doar codul poștal.", "sql": "-- нарушение: country зависит от postal_code, а не от ключа\npostal_code char(6),\ncountry varchar(40)\n-- лечится таблицей postal_codes", "res_ru": null, "res_ro": null}, "Denormalization": {"ru": "Обратный ход: вы сознательно нарушаете правила, чтобы читать быстрее. Вместо того чтобы каждый раз складывать платежи, хранят готовую сумму в таблице учеников. Выигрыш в скорости есть, но платить приходится дисциплиной: теперь каждый новый платёж обязан обновлять и эту сумму. Забыли один раз — данные разошлись, и сервер об этом не скажет.", "ro": "Mersul invers: încălcați conștient regulile ca să citiți mai repede. În loc să adunați de fiecare dată plățile, se păstrează suma gata în tabelul elevilor. Câștigul de viteză există, dar se plătește cu disciplină: acum fiecare plată nouă trebuie să actualizeze și această sumă. Ați uitat o dată — datele s-au despărțit, iar serverul nu vă va spune.", "sql": "ALTER TABLE students ADD total_paid decimal(9,2);\n-- вместо SUM(amount) при каждом показе — но теперь\n-- каждый платёж обязан менять и это поле", "res_ru": null, "res_ro": null}, "Full · Differential": {"ru": "Два вида резервной копии. Полная копирует всю базу. Дифференциальная — только то, что изменилось с последней ПОЛНОЙ копии. Вот тут и ловят: не с предыдущей дифференциальной, а именно с полной. Поэтому каждая следующая дифференциальная копия чуть больше предыдущей.", "ro": "Două feluri de copie de rezervă. Cea completă copiază toată baza. Cea diferențială — doar ce s-a schimbat de la ultima copie COMPLETĂ. Aici și prind: nu de la cea diferențială anterioară, ci anume de la cea completă. De aceea fiecare copie diferențială următoare este puțin mai mare decât cea dinainte.", "sql": "BACKUP DATABASE nexus_academy TO DISK = 'C:\\\\bak\\\\full.bak';\nBACKUP DATABASE nexus_academy TO DISK = 'C:\\\\bak\\\\diff.bak' WITH DIFFERENTIAL;", "res_ru": null, "res_ro": null}, "GRANT · REVOKE": {"ru": "GRANT выдаёт право, REVOKE забирает обратно. Эти две команды пишутся одинаково на всех серверах, так что путаницы не будет. Отличается другое — чем ПРОВЕРЯЮТ выданные права: в SQL Server это sp_helprotect, в MySQL SHOW GRANTS, в PostgreSQL запрос к системной таблице. Экзамен спрашивает про SQL Server.", "ro": "GRANT dă dreptul, REVOKE îl ia înapoi. Aceste două comenzi se scriu la fel pe toate serverele, deci confuzie nu va fi. Diferă altceva — cu ce se VERIFICĂ drepturile acordate: în SQL Server este sp_helprotect, în MySQL SHOW GRANTS, în PostgreSQL o interogare la un tabel de sistem. Examenul întreabă despre SQL Server.", "sql": "GRANT SELECT ON students TO nexus_reader;\nREVOKE SELECT ON students FROM nexus_reader;\nEXEC sp_helprotect 'students';   -- проверка в SQL Server", "res_ru": null, "res_ro": null}, "Hashing · Masking": {"ru": "Пароль никогда не хранят так, чтобы его можно было прочитать. Хранят хеш — отпечаток, из которого пароль обратно не достать. При входе сравнивают не пароли, а отпечатки. Маскирование — другое: значение остаётся на месте, но часть его закрывают звёздочками, чтобы сотрудник видел последние цифры и не видел весь номер.", "ro": "Parola nu se păstrează niciodată astfel încât să poată fi citită. Se păstrează hash-ul — o amprentă din care parola nu poate fi scoasă înapoi. La intrare se compară nu parolele, ci amprentele. Mascarea este altceva: valoarea rămâne la locul ei, dar o parte din ea se acoperă cu stele, ca angajatul să vadă ultimele cifre și să nu vadă tot numărul.", "sql": "SELECT CONVERT(char(64), HASHBYTES('SHA2_256', 'MySecret123'), 2);\nSELECT '****' + RIGHT(phone, 4) AS masked FROM students;", "res_ru": null, "res_ro": null}, "VIEW": {"ru": "Представление — это запрос, которому дали имя и сохранили. Данные в нём не копируются: каждый раз, когда вы к нему обращаетесь, запрос выполняется заново. Поэтому добавили ученика в таблицу — он сразу виден и в представлении. И поэтому же DROP VIEW убирает только сам запрос, а таблица остаётся нетронутой. Это любимый вопрос экзамена.", "ro": "View-ul este o interogare căreia i s-a dat un nume și a fost salvată. Datele nu se copiază în el: de fiecare dată când îl accesați, interogarea se execută din nou. De aceea ați adăugat un elev în tabel — el se vede imediat și în view. Și tot de aceea DROP VIEW scoate doar interogarea, iar tabelul rămâne neatins. Este întrebarea preferată a examenului.", "sql": "CREATE VIEW vw_student_list AS\nSELECT first_name, last_name, grade FROM students;\n\nSELECT * FROM vw_student_list;", "res_ru": "Добавили ученика в таблицу — он сразу виден во вью.", "res_ro": "Ați adăugat un elev în tabel — apare imediat în view."}, "Stored procedure": {"ru": "Сохранённая команда, которой можно передать значение. Входной параметр работает как фильтр: передали число 10 — процедура изменит только десятые классы. Процедура умеет менять данные, и это спрашивают отдельно. А вот показать результат запроса сама по себе она не может — для этого нужно слово RETURN.", "ro": "O comandă salvată căreia i se poate transmite o valoare. Parametrul de intrare lucrează ca filtru: ați transmis numărul 10 — procedura va modifica doar clasele a zecea. Procedura știe să modifice date, și asta se întreabă separat. Dar să arate singură rezultatul interogării nu poate — pentru asta e nevoie de cuvântul RETURN.", "sql": "CREATE PROCEDURE raise_tuition @p_grade smallint\nAS\nBEGIN\n    UPDATE students SET tuition = tuition + 50 WHERE grade = @p_grade;\nEND;\n\nEXEC raise_tuition 10;", "res_ru": null, "res_ro": null}, "Function": {"ru": "Функция отличается от процедуры одним: она всегда возвращает значение и поэтому её можно поставить прямо внутрь запроса, рядом со столбцами. Процедуру так не поставишь — её вызывают отдельной командой. Если в вопросе спрашивают разницу, ответ именно такой.", "ro": "Funcția se deosebește de procedură printr-un lucru: ea întoarce mereu o valoare și de aceea poate fi pusă chiar în interiorul interogării, lângă coloane. Procedura nu se poate pune așa — ea se apelează printr-o comandă separată. Dacă în întrebare se cere diferența, răspunsul este exact acesta.", "sql": "CREATE FUNCTION student_total_paid (@id int)\nRETURNS decimal(9,2)\nAS\nBEGIN\n    DECLARE @t decimal(9,2);\n    SELECT @t = COALESCE(SUM(amount), 0) FROM payments WHERE student_id = @id;\n    RETURN @t;\nEND;\n\nSELECT last_name, dbo.student_total_paid(student_id) FROM students;", "res_ru": null, "res_ro": null}, "Clustered index": {"ru": "Это не отдельный список, а сам порядок, в котором строки лежат на диске. Как алфавитный порядок учеников в журнале: искать легко, но порядок может быть только один. Поэтому кластерный индекс на таблице один, и создаётся он сам вместе с первичным ключом — отдельной команды для него писать не нужно.", "ro": "Nu este o listă separată, ci chiar ordinea în care rândurile stau pe disc. Ca ordinea alfabetică a elevilor în catalog: e ușor de căutat, dar ordinea poate fi doar una. De aceea indexul clustered este unul singur pe tabel și se creează singur odată cu cheia primară — nu trebuie să scrieți o comandă separată pentru el.", "sql": "CREATE TABLE index_demo (\n    id int PRIMARY KEY,   -- здесь и создаётся кластерный индекс\n    last_name varchar(50));", "res_ru": null, "res_ro": null}, "Non-clustered index": {"ru": "Это отдельный список-указатель, как алфавитный указатель в конце учебника: слово и номер страницы. Их можно сделать сколько угодно и на любые столбцы. Поиск ускоряется, но за это платят: индекс занимает место и замедляет вставку. И ещё важное: под внешний ключ индекс сам НЕ создаётся ни в SQL Server, ни в PostgreSQL — это делает только MySQL.", "ro": "Este o listă-indicator separată, ca indexul alfabetic de la sfârșitul manualului: cuvântul și numărul paginii. Pot fi făcute oricâte și pe orice coloane. Căutarea se accelerează, dar se plătește pentru asta: indexul ocupă loc și încetinește inserarea. Și încă ceva important: pentru cheia externă indexul NU se creează singur nici în SQL Server, nici în PostgreSQL — asta o face doar MySQL.", "sql": "CREATE INDEX ndx_last_name ON students (last_name);\nCREATE INDEX ndx_full_name ON students (last_name, first_name);", "res_ru": "Составной индекс читается слева направо: по одному first_name он не поможет.", "res_ro": "Indexul compus se citește de la stânga la dreapta: doar după first_name nu ajută."}, "WHERE": {"ru": "Решает, какие строки попадут в ответ, а какие нет. Работает ДО того, как строки соберут в группы, — и отсюда главное ограничение: написать в WHERE слово COUNT или SUM нельзя, итога ещё не существует. Для фильтра по итогу есть другое слово, HAVING.", "ro": "Decide ce rânduri ajung în răspuns și care nu. Lucrează ÎNAINTE ca rândurile să fie adunate în grupuri — și de aici limitarea principală: în WHERE nu se poate scrie cuvântul COUNT sau SUM, totalul încă nu există. Pentru filtrul după total există alt cuvânt, HAVING.", "sql": "SELECT last_name, tuition FROM students\nWHERE tuition > 1200 AND is_active = 1;", "res_ru": null, "res_ro": null}, "ORDER BY": {"ru": "Сортировка, и она всегда стоит последней строкой запроса. По возрастанию — ASC, но его можно не писать, он и так по умолчанию. По убыванию — DESC. Сортировать можно сразу по нескольким столбцам: сначала по первому, а при равенстве — по второму.", "ro": "Sortarea, și ea stă mereu pe ultimul rând al interogării. Crescător — ASC, dar poate fi omis, este oricum implicit. Descrescător — DESC. Se poate sorta după mai multe coloane deodată: mai întâi după prima, iar la egalitate — după a doua.", "sql": "SELECT last_name, tuition FROM students\nORDER BY tuition DESC, last_name ASC;", "res_ru": null, "res_ro": null}, "LIKE": {"ru": "Поиск по куску текста, когда точное значение неизвестно. Два знака: процент заменяет сколько угодно символов, в том числе ни одного, а подчёркивание — ровно один. Поэтому 'C%' найдёт все фамилии на C, а '_usu' — только те, где перед usu стоит ровно одна буква.", "ro": "Căutare după o bucată de text, când valoarea exactă nu este cunoscută. Două semne: procentul înlocuiește oricâte caractere, inclusiv niciunul, iar liniuța de subliniere — exact unul. De aceea 'C%' va găsi toate numele cu C, iar '_usu' — doar pe acelea unde înainte de usu stă exact o literă.", "sql": "SELECT last_name FROM students WHERE last_name LIKE 'C%';    -- начинается на C\nSELECT last_name FROM students WHERE last_name LIKE '_usu';  -- ровно 4 буквы, Rusu", "res_ru": null, "res_ro": null}, "BETWEEN": {"ru": "Короткая запись для диапазона: вместо двух условий со знаками больше-меньше пишут одно. Главное, что надо запомнить: ОБЕ границы входят в результат. BETWEEN 900 AND 1300 возьмёт и того, у кого ровно 1300. Это спрашивают очень часто, и ошибаются именно здесь.", "ro": "Scrierea scurtă pentru un interval: în loc de două condiții cu semnele mai mare și mai mic se scrie una singură. Principalul de ținut minte: AMBELE limite intră în rezultat. BETWEEN 900 AND 1300 îl va lua și pe cel care are exact 1300. Asta se întreabă foarte des, și aici se greșește.", "sql": "SELECT last_name, tuition FROM students\nWHERE tuition BETWEEN 900 AND 1300;", "res_ru": "Ученик со взносом ровно 1300 в выборке есть.", "res_ro": "Elevul cu taxa exact 1300 este în rezultat."}, "IN · NOT IN": {"ru": "Проверка «значение входит в этот список». Короткая замена для цепочки OR: вместо трёх сравнений — одно. А теперь ловушка, которую ставят на экзамене: если в списке окажется пустое значение, NOT IN не вернёт ни одной строки. Сравнение с пустотой никогда не бывает истинным, поэтому отсеивается всё.", "ro": "Verificarea „valoarea se află în această listă”. Înlocuire scurtă pentru un lanț de OR: în loc de trei comparații — una. Iar acum capcana care se pune la examen: dacă în listă apare o valoare goală, NOT IN nu va întoarce niciun rând. Comparația cu golul nu este niciodată adevărată, de aceea se elimină tot.", "sql": "SELECT last_name FROM students WHERE city IN ('Chisinau', 'Balti');\nSELECT last_name FROM students WHERE city NOT IN ('Cahul');", "res_ru": null, "res_ro": null}, "TOP · LIMIT": {"ru": "Ограничение «покажи только первые несколько». Одно и то же слово у каждого сервера своё: TOP в SQL Server, LIMIT в PostgreSQL и MySQL, FETCH FIRST по стандарту. И важное: без ORDER BY слово «первые» не значит ничего — сервер отдаст те строки, которые попались ему первыми, и в следующий раз они могут быть другими.", "ro": "Limitarea „arată doar primele câteva”. Același cuvânt este altul la fiecare server: TOP în SQL Server, LIMIT în PostgreSQL și MySQL, FETCH FIRST după standard. Și important: fără ORDER BY cuvântul „primele” nu înseamnă nimic — serverul va da rândurile care i-au venit primele, iar data viitoare ele pot fi altele.", "sql": "SELECT TOP 3 last_name, tuition FROM students ORDER BY tuition DESC;  -- SQL Server\nSELECT last_name FROM students ORDER BY tuition DESC LIMIT 3;         -- PostgreSQL", "res_ru": null, "res_ro": null}, "IS NULL": {"ru": "Пустая клетка — это не ноль и не пустая строка, это отсутствие значения. Поэтому сравнивать её знаком равенства бессмысленно: условие `= NULL` не совпадёт никогда, запрос честно вернёт ноль строк и ошибки не будет. Для пустоты есть особые слова: IS NULL и IS NOT NULL.", "ro": "O căsuță goală nu este nici zero, nici un text gol, este lipsa valorii. De aceea compararea ei cu semnul egal nu are sens: condiția `= NULL` nu se va potrivi niciodată, interogarea va întoarce cinstit zero rânduri și eroare nu va fi. Pentru gol există cuvinte speciale: IS NULL și IS NOT NULL.", "sql": "SELECT last_name FROM students WHERE phone IS NULL;      -- 2 строки\nSELECT last_name FROM students WHERE phone = NULL;       -- 0 строк, всегда", "res_ru": null, "res_ro": null}, "INNER JOIN": {"ru": "Соединяет две таблицы и оставляет только те строки, у которых пара нашлась с обеих сторон. Ученик, не записанный ни на один предмет, в ответ не попадёт. Предмет, на который никто не ходит, тоже. Если в вопросе звучит «только те, у кого есть» — это INNER JOIN.", "ro": "Îmbină două tabele și lasă doar rândurile care au găsit pereche de ambele părți. Elevul neînscris la nicio materie nu va ajunge în răspuns. Nici materia la care nu merge nimeni. Dacă în întrebare sună „doar aceia care au” — acesta este INNER JOIN.", "sql": "SELECT s.last_name, j.title\nFROM students s\nJOIN enrollments e ON e.student_id = s.student_id\nJOIN subjects    j ON j.subject_id = e.subject_id;", "res_ru": "20 строк: только записи на предметы.", "res_ro": "20 de rânduri: doar înscrierile la materii."}, "LEFT JOIN": {"ru": "Сохраняет ВСЕ строки первой таблицы, даже если пары во второй нет. Там, где пары нет, столбцы второй таблицы заполняются пустотой. Отсюда главный приём: добавьте к такому запросу IS NULL — и вы получите именно тех, у кого пары нет. Так ищут учеников без предметов и предметы без учеников.", "ro": "Păstrează TOATE rândurile primului tabel, chiar dacă perechea în al doilea nu există. Acolo unde perechea lipsește, coloanele celui de-al doilea tabel se umplu cu gol. De aici procedeul principal: adăugați la o astfel de interogare IS NULL — și veți primi anume pe aceia care nu au pereche. Așa se caută elevii fără materii și materiile fără elevi.", "sql": "SELECT s.last_name, j.title\nFROM students s\nLEFT JOIN enrollments e ON e.student_id = s.student_id\nLEFT JOIN subjects    j ON j.subject_id = e.subject_id;\n\n-- кто не записан ни на один предмет:\n-- ... WHERE e.student_id IS NULL", "res_ru": null, "res_ro": null}, "FULL · CROSS": {"ru": "FULL OUTER JOIN сохраняет непарные строки сразу с обеих сторон — и учеников без предметов, и предметы без учеников. CROSS JOIN устроен иначе: у него вообще нет условия, он соединяет каждую строку с каждой. Двадцать учеников и шесть предметов дадут сто двадцать строк. Случайный CROSS JOIN — частая причина того, что строк вдруг стало слишком много.", "ro": "FULL OUTER JOIN păstrează rândurile fără pereche deodată de ambele părți — și elevii fără materii, și materiile fără elevi. CROSS JOIN este făcut altfel: el nu are deloc condiție, îmbină fiecare rând cu fiecare. Douăzeci de elevi și șase materii vor da o sută douăzeci de rânduri. Un CROSS JOIN întâmplător este o cauză frecventă a faptului că rândurile au devenit brusc prea multe.", "sql": "SELECT s.last_name, j.title FROM students s\nFULL OUTER JOIN enrollments e ON e.student_id = s.student_id\nFULL OUTER JOIN subjects j ON j.subject_id = e.subject_id;\n\nSELECT COUNT(*) FROM students CROSS JOIN subjects;   -- 20 × 6 = 120", "res_ru": null, "res_ro": null}, "Self join": {"ru": "Таблицу соединяют саму с собой, дав ей два разных имени. Нужно это там, где строка ссылается на строку той же таблицы: преподаватель и его наставник, сотрудник и его руководитель. Одно имя означает «подчинённый», второе — «наставник», и запрос читает обоих сразу.", "ro": "Tabelul se îmbină cu el însuși, dându-i două nume diferite. Este necesar acolo unde un rând face trimitere la un rând din același tabel: profesorul și mentorul lui, angajatul și șeful lui. Un nume înseamnă „subordonat”, al doilea — „mentor”, iar interogarea îi citește pe amândoi deodată.", "sql": "SELECT t.last_name AS teacher, m.last_name AS mentor\nFROM teachers t\nLEFT JOIN teachers m ON m.teacher_id = t.mentor_id;", "res_ru": "У тех, кто без наставника, в колонке mentor пусто.", "res_ro": "La cei fără mentor, coloana mentor este goală."}, "UNION · UNION ALL": {"ru": "Ставит результаты двух запросов друг под друга — не рядом, как JOIN, а именно в столбик. UNION при этом убирает повторы и потому работает медленнее. UNION ALL оставляет всё как есть и быстрее. Условие одно: у обоих запросов должно быть одинаковое число столбцов и совместимые типы. Заголовки берутся от первого запроса.", "ro": "Pune rezultatele a două interogări unul sub altul — nu alături, ca JOIN, ci anume în coloană. UNION scoate în același timp duplicatele și de aceea lucrează mai încet. UNION ALL lasă tot așa cum este și e mai rapid. Condiția este una: ambele interogări trebuie să aibă același număr de coloane și tipuri compatibile. Titlurile se iau de la prima interogare.", "sql": "SELECT last_name FROM students\nUNION\nSELECT last_name FROM teachers;      -- 19 строк\n\nSELECT last_name FROM students\nUNION ALL\nSELECT last_name FROM teachers;  -- 27 строк", "res_ru": null, "res_ro": null}, "DISTINCT": {"ru": "Убирает повторы из результата. Важная тонкость: он смотрит на строку целиком, а не на один столбец. Если в SELECT один столбец — получите список разных городов. Если два — строки будут считаться разными, когда отличается хотя бы один из них, и список выйдет длиннее, чем ожидалось.", "ro": "Scoate duplicatele din rezultat. O subtilitate importantă: el se uită la rândul întreg, nu la o singură coloană. Dacă în SELECT este o coloană — veți primi lista orașelor diferite. Dacă sunt două — rândurile vor fi considerate diferite când se deosebește măcar una dintre ele, iar lista va ieși mai lungă decât vă așteptați.", "sql": "SELECT DISTINCT city FROM students;              -- 4 города\nSELECT DISTINCT city, grade FROM students;       -- пар больше", "res_ru": null, "res_ro": null}, "INTERSECT · EXCEPT": {"ru": "Два родственника UNION, и работают они так же — в столбик. INTERSECT оставляет то, что есть в обоих запросах сразу: фамилии, которые встречаются и среди учеников, и среди преподавателей. EXCEPT оставляет то, что есть в первом и чего нет во втором. Требования к столбцам те же, что у UNION.", "ro": "Două rude ale lui UNION, și lucrează la fel — în coloană. INTERSECT lasă ce există în ambele interogări deodată: numele care se întâlnesc și printre elevi, și printre profesori. EXCEPT lasă ce există în prima și nu există în a doua. Cerințele pentru coloane sunt aceleași ca la UNION.", "sql": "SELECT last_name FROM students\nINTERSECT\nSELECT last_name FROM teachers;   -- общие фамилии\n\nSELECT last_name FROM students\nEXCEPT\nSELECT last_name FROM teachers;", "res_ru": null, "res_ro": null}, "Alias · Computed · CONCAT": {"ru": "Три приёма, которые меняют вид ответа, но не трогают таблицу. Псевдоним через AS даёт столбцу другой заголовок — удобно для отчёта. Вычисляемый столбец считается прямо во время запроса: скидку нигде не хранят, её получают умножением. CONCAT склеивает текст из нескольких кусков. Ни один из трёх в таблице ничего не создаёт.", "ro": "Trei procedee care schimbă aspectul răspunsului, dar nu ating tabelul. Alias-ul prin AS dă coloanei alt titlu — comod pentru un raport. Coloana calculată se socotește chiar în timpul interogării: reducerea nu se păstrează nicăieri, ea se obține prin înmulțire. CONCAT lipește textul din mai multe bucăți. Niciunul dintre cele trei nu creează nimic în tabel.", "sql": "SELECT CONCAT(first_name, ' ', last_name) AS [Full name],\n       tuition AS [Full price],\n       CAST(tuition * 0.9 AS decimal(8,2)) AS [10% Off]\nFROM students;", "res_ru": "Столбца «10% Off» в таблице нет — он живёт только в ответе.", "res_ro": "Coloana „10% Off” nu există în tabel — ea trăiește doar în răspuns."}, "GROUP BY": {"ru": "Превращает много строк в несколько итогов. Собирает строки в кучки по одинаковому значению — например, по классу — и к каждой кучке применяет подсчёт. Правило, на котором спотыкаются: каждый столбец из SELECT, который не стоит внутри COUNT, SUM или другого итога, обязан повторяться и в GROUP BY. Иначе сервер не поймёт, какое из многих значений показать.", "ro": "Transformă multe rânduri în câteva totaluri. Adună rândurile în grămăjoare după aceeași valoare — de exemplu, după clasă — și aplică numărătoarea fiecărei grămăjoare. Regula de care se împiedică: fiecare coloană din SELECT care nu stă în interiorul lui COUNT, SUM sau alt total trebuie să se repete și în GROUP BY. Altfel serverul nu înțelege care dintre multele valori să le arate.", "sql": "SELECT grade, COUNT(*) AS students_in_grade\nFROM students\nGROUP BY grade\nORDER BY grade;", "res_ru": null, "res_ro": null}, "HAVING": {"ru": "Фильтр, который применяют уже к готовым итогам. Разница с WHERE простая: WHERE отбирает строки до того, как их сложили в группы, а HAVING отбирает сами группы после подсчёта. Поэтому «ученики старше 16» — это WHERE, а «классы, где больше пяти учеников» — это HAVING.", "ro": "Filtrul care se aplică deja totalurilor gata. Diferența față de WHERE este simplă: WHERE alege rândurile înainte ca ele să fie adunate în grupuri, iar HAVING alege grupurile însele după numărătoare. De aceea „elevii mai mari de 16 ani” este WHERE, iar „clasele unde sunt mai mult de cinci elevi” este HAVING.", "sql": "SELECT grade, COUNT(*) AS n\nFROM students\nGROUP BY grade\nHAVING COUNT(*) > 5;", "res_ru": null, "res_ro": null}, "COUNT(*) · COUNT(col)": {"ru": "Две почти одинаковые записи с разным смыслом. COUNT(*) считает строки — все подряд. COUNT(столбца) считает только те строки, где в этом столбце что-то есть, а пустые пропускает. Пока таблица одна, разницы почти не видно. А вот после LEFT JOIN она становится решающей: ученик без платежей всё равно даёт одну строку, поэтому COUNT(*) покажет у него единицу вместо нуля. Запрос отработает без ошибки, и отчёт будет неверным.", "ro": "Două scrieri aproape identice cu sens diferit. COUNT(*) numără rândurile — toate la rând. COUNT(coloană) numără doar rândurile unde în acea coloană există ceva, iar pe cele goale le sare. Cât timp tabelul este unul singur, diferența aproape nu se vede. Dar după LEFT JOIN ea devine decisivă: elevul fără plăți dă oricum un rând, de aceea COUNT(*) va arăta la el unu în loc de zero. Interogarea va merge fără eroare, iar raportul va fi greșit.", "sql": "SELECT s.last_name,\n       COUNT(*)            AS wrong,\n       COUNT(p.payment_id) AS correct\nFROM students s\nLEFT JOIN payments p ON p.student_id = s.student_id\nGROUP BY s.student_id, s.last_name;", "res_ru": "У кто не платил: wrong = 1, correct = 0. Верно второе.", "res_ro": "La cine nu a plătit: wrong = 1, correct = 0. Corect este al doilea."}, "SUM · AVG · MIN · MAX": {"ru": "Четыре подсчёта: сумма, среднее, наименьшее и наибольшее. У всех четырёх общая черта — пустые значения они просто пропускают, как будто таких строк нет. Отсюда неожиданность: среднее, посчитанное через AVG, может не совпасть с суммой, делённой на общее число строк. Делители разные: AVG делит только на непустые.", "ro": "Patru numărători: suma, media, cea mai mică și cea mai mare. Toate patru au o trăsătură comună — valorile goale pur și simplu le sar, ca și cum astfel de rânduri nu ar exista. De aici o surpriză: media socotită prin AVG poate să nu coincidă cu suma împărțită la numărul total de rânduri. Împărțitorii sunt diferiți: AVG împarte doar la cele necompletate.", "sql": "SELECT SUM(tuition) AS total,\n       AVG(tuition) AS average,\n       MIN(tuition) AS smallest,\n       MAX(tuition) AS largest\nFROM students;", "res_ru": "Сумма 22990.50 при 20 учениках.", "res_ro": "Suma 22990.50 la 20 de elevi."}, "INSERT … VALUES": {"ru": "Добавление строк вручную. Три части: куда добавляем, в какие столбцы и какие значения. Слово VALUES отделяет имена столбцов от данных, и без него сервер просто не понимает, где кончается одно и начинается другое. Это самая частая синтаксическая ошибка в заданиях курса.", "ro": "Adăugarea rândurilor manual. Trei părți: unde adăugăm, în ce coloane și ce valori. Cuvântul VALUES desparte numele coloanelor de date, iar fără el serverul pur și simplu nu înțelege unde se termină una și începe alta. Este cea mai frecventă eroare de sintaxă din sarcinile cursului.", "sql": "INSERT INTO subjects (title, hours_total)\nVALUES ('Astronomy', 34);\n\n-- без VALUES — Msg 102, incorrect syntax", "res_ru": null, "res_ro": null}, "INSERT … SELECT": {"ru": "Второй способ добавить строки: не перечислять их руками, а взять из другой таблицы запросом. Так копируют двенадцатиклассников в архив одной командой. Запомните отличие: слова VALUES здесь нет вообще. Если его написать, команда сломается.", "ro": "Al doilea mod de a adăuga rânduri: nu să le enumerați manual, ci să le luați din alt tabel printr-o interogare. Așa se copiază elevii de clasa a douăsprezecea în arhivă cu o singură comandă. Țineți minte diferența: cuvântul VALUES nu există deloc aici. Dacă îl scrieți, comanda se strică.", "sql": "INSERT INTO students_archive (student_id, first_name, last_name, grade)\nSELECT student_id, first_name, last_name, grade\nFROM students WHERE grade = 12;", "res_ru": null, "res_ro": null}, "UPDATE … WHERE": {"ru": "Изменение данных. Самое опасное место всего курса: забыли WHERE — и изменились ВСЕ строки таблицы. Сервер не спросит «вы уверены?», не выдаст предупреждения и не даст отменить. Поэтому правило: сначала тот же запрос с SELECT, посмотрите, сколько строк он вернул, и только потом меняйте WHERE на UPDATE.", "ro": "Modificarea datelor. Cel mai periculos loc din tot cursul: ați uitat WHERE — și s-au schimbat TOATE rândurile tabelului. Serverul nu va întreba „sunteți sigur?”, nu va da avertisment și nu va permite anularea. De aceea regula: mai întâi aceeași interogare cu SELECT, uitați-vă câte rânduri a întors, și abia apoi schimbați WHERE pe UPDATE.", "sql": "SELECT COUNT(*) FROM students WHERE grade = 12;   -- сначала считаем\nUPDATE students\nSET    tuition = tuition + 100\nWHERE  grade = 12;                                -- потом меняем", "res_ru": null, "res_ro": null}, "DELETE": {"ru": "Удаляет строки, и только те, которые подошли под условие. Этим отличается от двух соседей: TRUNCATE убирает все строки сразу, а DROP убирает саму таблицу. И ещё различие, которое спрашивают: DELETE относится к DML, то есть работает с данными, а TRUNCATE и DROP — к DDL, они меняют структуру.", "ro": "Șterge rânduri, și doar pe acelea care s-au potrivit condiției. Prin asta se deosebește de cei doi vecini: TRUNCATE scoate toate rândurile deodată, iar DROP scoate chiar tabelul. Și încă o deosebire care se întreabă: DELETE face parte din DML, adică lucrează cu datele, iar TRUNCATE și DROP — din DDL, ele schimbă structura.", "sql": "DELETE FROM students_test WHERE grade = 12;   -- строки по условию\nTRUNCATE TABLE students_test;                 -- все строки, шапка остаётся\nDROP TABLE students_test;                     -- таблицы больше нет", "res_ru": null, "res_ro": null}, "Transaction": {"ru": "Это и есть та самая отмена, которой «у SQL нет». BEGIN открывает транзакцию, и всё сделанное после него пока не окончательно. ROLLBACK возвращает как было, COMMIT закрепляет навсегда. В объективах экзамена этого нет, но именно так работают с данными в жизни: сначала транзакция, потом проверка, потом решение.", "ro": "Aceasta este chiar anularea pe care „SQL nu o are”. BEGIN deschide tranzacția, și tot ce se face după el încă nu este definitiv. ROLLBACK readuce cum a fost, COMMIT confirmă pentru totdeauna. În obiectivele examenului asta nu există, dar anume așa se lucrează cu datele în viață: mai întâi tranzacția, apoi verificarea, apoi decizia.", "sql": "BEGIN TRANSACTION;\n    DELETE FROM students_test;\n    SELECT COUNT(*) FROM students_test;  -- 0\nROLLBACK;\nSELECT COUNT(*) FROM students_test;      -- строки вернулись", "res_ru": null, "res_ro": null}, "Syntax error": {"ru": "Команда написана неправильно, и сервер не смог её даже прочитать. Пропущено слово, не закрыта скобка, опечатка в названии. Главный признак: команда не выполнилась ВООБЩЕ, ни одна строка не изменилась. Проверьте текст команды, а не данные.", "ro": "Comanda este scrisă greșit, iar serverul nici nu a putut să o citească. Lipsește un cuvânt, o paranteză nu e închisă, o greșeală în denumire. Semnul principal: comanda nu s-a executat DELOC, niciun rând nu s-a schimbat. Verificați textul comenzii, nu datele.", "sql": "INSERT INTO subjects (title, hours_total) ('Astronomy', 34);\n-- Msg 102, Incorrect syntax near '('", "res_ru": null, "res_ro": null}, "Runtime error": {"ru": "Команда написана безупречно, сервер её прочитал, начал выполнять — и отказал. Отказали данные: такой ключ уже есть, родителя с таким номером не существует, значение не влезает в столбец. Главный признак: ошибка возникла при выполнении, а не при чтении. Проверять надо данные, а не текст.", "ro": "Comanda este scrisă impecabil, serverul a citit-o, a început să o execute — și a refuzat. Au refuzat datele: o astfel de cheie există deja, un părinte cu acest număr nu există, valoarea nu încape în coloană. Semnul principal: eroarea a apărut la execuție, nu la citire. Trebuie verificate datele, nu textul.", "sql": "INSERT INTO students (student_id, first_name, last_name) VALUES (1, 'Copy', 'Of Anna');\n-- Msg 2627, Violation of PRIMARY KEY constraint", "res_ru": null, "res_ro": null}, "Тихая ошибка": {"ru": "Самый опасный случай: команда выполнилась, сообщения нет, всё выглядит нормально — а число строк неверное. Сервер не ошибся, он сделал ровно то, что вы написали. Ошибка в замысле. Найти её можно только одним способом: ДО запуска сказать, сколько строк вы ожидаете, и сравнить. Поэтому в курсе так часто просят предсказать ответ заранее.", "ro": "Cel mai periculos caz: comanda s-a executat, mesaj nu există, totul arată normal — iar numărul de rânduri este greșit. Serverul nu a greșit, a făcut exact ce ați scris. Greșeala este în idee. Ea poate fi găsită într-un singur fel: ÎNAINTE de rulare să spuneți câte rânduri așteptați, și să comparați. De aceea în curs vi se cere atât de des să preziceți răspunsul dinainte.", "sql": "SELECT COUNT(*) FROM students s\nLEFT JOIN payments p ON p.student_id = s.student_id;\n-- 23, а не 20: у кого два платежа, тот посчитан дважды", "res_ru": null, "res_ro": null}, "Msg 2627 · 547": {"ru": "Два номера, которые стоит узнавать с первого взгляда, не вчитываясь в текст. 2627 — вы повторили первичный ключ, такая строка уже есть. 547 — нарушен внешний ключ, и это может быть в двух случаях: добавляете ребёнка без родителя или удаляете родителя, у которого есть дети. Рядом полезно помнить 515: вы не положили значение в столбец, который обязателен.", "ro": "Două numere pe care merită să le recunoașteți din prima, fără să citiți textul. 2627 — ați repetat cheia primară, un astfel de rând există deja. 547 — este încălcată cheia externă, și asta poate fi în două cazuri: adăugați un copil fără părinte sau ștergeți un părinte care are copii. Alături este util să țineți minte 515: nu ați pus o valoare într-o coloană obligatorie.", "sql": "-- Msg 2627 · Violation of PRIMARY KEY constraint\n-- Msg 547  · The INSERT statement conflicted with the FOREIGN KEY constraint\n-- Msg 515  · Cannot insert the value NULL into column", "res_ru": null, "res_ro": null}, "40 вопросов · 45 минут": {"ru": "Около сорока вопросов за сорок пять минут — это примерно минута на вопрос, и времени достаточно, если не застревать. Проходной балл около 700 из 1000. Важно: за пропущенный вопрос баллов не дают, а за неверный ничего не отнимают. Поэтому отвечать надо на все, даже наугад. Застряли дольше двух минут — отметьте вопрос и идите дальше.", "ro": "În jur de patruzeci de întrebări în patruzeci și cinci de minute — este cam un minut pe întrebare, și timpul ajunge dacă nu vă blocați. Pragul de trecere este în jur de 700 din 1000. Important: pentru o întrebare sărită nu se dau puncte, iar pentru una greșită nu se scade nimic. De aceea trebuie să răspundeți la toate, chiar și la nimereală. V-ați blocat mai mult de două minute — marcați întrebarea și mergeți mai departe.", "sql": "-- Считайте так:\n-- 40 вопросов ÷ 45 минут ≈ 1 минута на вопрос\n-- застряли дольше двух — отметьте и идите дальше", "res_ru": null, "res_ro": null}, "Выборка данных": {"ru": "Самая большая часть экзамена: из пятидесяти девяти пунктов тридцать приходятся на неё, то есть примерно каждый второй вопрос. Вывод простой: если времени на повторение осталось мало, начинайте с раздела 8 этой карты, а не с начала. Проектирование и ключи дадут вам четверть вопросов, а выборка — половину.", "ro": "Cea mai mare parte a examenului: din cincizeci și nouă de puncte, treizeci îi revin ei, adică aproximativ fiecare a doua întrebare. Concluzia este simplă: dacă v-a rămas puțin timp de recapitulare, începeți cu secțiunea 8 din această hartă, nu de la început. Proiectarea și cheile vă vor da un sfert din întrebări, iar extragerea — jumătate.", "sql": "-- Вес частей экзамена:\n-- выборка данных      ~50%\n-- проектирование     ~25%\n-- объекты базы       ~12%\n-- изменение и ошибки ~12%", "res_ru": null, "res_ro": null}, "Пробные тесты": {"ru": "Порядок важен. Сначала проходите тест по одной теме: так сразу видно, где именно дыра. Потом полный тест на время — он проверяет уже не знание, а умение уложиться. И главное: разбирайте каждый неверный ответ. Сам по себе балл ничему не учит, учит разбор того, почему вы выбрали не тот вариант.", "ro": "Ordinea contează. Mai întâi treceți testul pe o singură temă: așa se vede imediat unde anume este gaura. Apoi testul complet contra timp — el verifică deja nu cunoștințele, ci priceperea de a vă încadra. Și principalul: analizați fiecare răspuns greșit. Punctajul singur nu vă învață nimic, vă învață analiza motivului pentru care ați ales varianta nepotrivită.", "sql": "-- Nexus_DB_Probnyy_ekzamen.html\n-- 6 тестов: по каждой теме и полный", "res_ru": null, "res_ro": null}, "Практика в базе": {"ru": "Двадцать семь заданий, которые делаются руками в живой базе, а не выбираются мышкой. У каждого есть проверка с числом: сошлось — задание сделано, не сошлось — ищите причину. Это дольше, чем тест, и полезнее: то, что сделали руками, на экзамене вспоминается само.", "ro": "Douăzeci și șapte de sarcini care se fac cu mâna într-o bază vie, nu se aleg cu mouse-ul. Fiecare are o verificare cu un număr: s-a potrivit — sarcina e făcută, nu s-a potrivit — căutați cauza. Este mai lung decât un test și mai util: ce ați făcut cu mâna vă vine singur în minte la examen.", "sql": "-- Nexus_DB_Prakticheskie_zadaniya_po_domenam.docx", "res_ru": null, "res_ro": null}, "Последний день": {"ru": "Новое не учат — за день оно не уляжется, а уверенность собьёт. Сделайте три вещи: пройдите эту карту сверху вниз, отвечая на каждый пункт вслух одним предложением; перечитайте свои ошибки из пробных тестов; просмотрите дословные формулировки. И выспитесь. На экзамене в сорок пять минут усталость стоит дороже, чем один невыученный пункт.", "ro": "Lucruri noi nu se învață — într-o zi nu se așază, iar încrederea v-o va strica. Faceți trei lucruri: parcurgeți această hartă de sus în jos, răspunzând la fiecare punct cu voce tare într-o frază; recitiți greșelile voastre din testele de probă; treceți prin formulările exacte. Și dormiți bine. La un examen de patruzeci și cinci de minute oboseala costă mai scump decât un punct neînvățat.", "sql": "-- План последнего дня:\n-- 1. эта карта сверху вниз, вслух\n-- 2. свои ошибки из тестов\n-- 3. дословные формулировки\n-- 4. спать", "res_ru": null, "res_ro": null}};
const ov=document.getElementById('ov'),bt=document.getElementById('bt'),
      bp=document.getElementById('bp'),bc=document.getElementById('bc'),
      br=document.getElementById('br');
let openKey=null;

function show(k){
  const d=DET[k]; if(!d) return;
  openKey=k; fill();
  ov.classList.add('on'); document.getElementById('bx').focus();
}
function fill(){
  const d=DET[openKey]; if(!d) return;
  const l=b.dataset.lang;
  bt.textContent=k_title(openKey,l);
  bp.textContent=l==='ro'?d.ro:d.ru;
  bc.textContent=d.sql;
  const r=l==='ro'?d.res_ro:d.res_ru;
  if(r){br.textContent=r;br.hidden=false}else{br.hidden=true}
}
function k_title(k,l){
  const g=document.querySelector('.pill[data-k="'+CSS.escape(k)+'"]');
  if(!g) return k;
  const t=[...g.querySelectorAll('text')].filter(x=>x.getAttribute('font-weight')==='700'
           && x.getAttribute('font-size')==='12.5');
  const m=t.find(x=>!x.classList.length||x.classList.contains(l));
  return m?m.textContent:k;
}
function hide(){ov.classList.remove('on');openKey=null}

document.querySelectorAll('.pill').forEach(g=>{
  g.setAttribute('tabindex','0');
  g.addEventListener('click',()=>show(g.dataset.k));
  g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();show(g.dataset.k)}});
});
document.getElementById('bx').onclick=hide;
ov.addEventListener('click',ev=>{if(ev.target===ov)hide()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')hide()});
const _set=set;
set=function(l){_set(l); if(openKey)fill();};
try{const s=localStorage.getItem('rm_lang');if(s)set(s)}catch(e){}
</script></body></html>
